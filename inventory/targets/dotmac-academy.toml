schema_version = "observability-target.v2"
kind = "targets"
product = "dotmac-academy"
owner = "academy-platform"

[[jobs]]
job = "dotmac-academy-app"
target_id = "dotmac-academy-app"
scheme = "https"
metrics_path = "/metrics"
authenticated = true
expected = 1

  # As-built instance label, expressible since ADR-0008. A logical host or
  # service name, not a resolved address; the private-material scan is what
  # keeps the distinction from eroding.
  [[jobs.static_labels]]
  name = "instance"
  value = "dotmac-academy"
