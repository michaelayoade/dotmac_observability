# OpenBao. Its published surface is the one census §14 revalidated: refused on
# both address families from outside the allowlist, reachable by the control
# runner over the tunnel only.
schema_version = "observability-target.v2"
kind = "targets"
product = "secret-store"
owner = "platform-operations"

# PARITY GAP, and it is material rather than cosmetic. The live job also sends
# `params: {format: [prometheus]}`, and OpenBao needs that parameter to emit
# Prometheus exposition instead of its own JSON. `observability-target.v2` has
# NO field a scrape parameter can be written into, so this document cannot
# express it and a render from this contract alone would scrape the wrong
# format. Recorded here rather than worked around: the contract needs a
# `params` field before this job can be promoted faithfully.
[[jobs]]
job = "openbao"
target_id = "openbao"
scheme = "http"
metrics_path = "/v1/sys/metrics"
authenticated = true
expected = 1
path_rationale = "OpenBao's built-in system metrics endpoint, fixed by the upstream API surface and identical on every OpenBao deployment; the path is dictated by the product rather than chosen to be unguessable."
