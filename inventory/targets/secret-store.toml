# OpenBao. Its published surface is the one census §14 revalidated: refused on
# both address families from outside the allowlist, reachable by the control
# runner over the tunnel only.
schema_version = "observability-target.v2"
kind = "targets"
product = "secret-store"
owner = "platform-operations"

# PARITY GAP CLOSED by ADR-0008. The live job sends `format=prometheus`, and
# OpenBao needs that parameter to emit Prometheus exposition instead of its own
# JSON — a scrape that succeeds and stores nothing. `observability-target.v2`
# had no field for it, so this document could not express it and a render from
# the public contract alone was silently wrong for this target. The amendment
# adds `params`, classified the same way `metrics_path` was: a parameter that
# selects an exposition FORMAT is scrape protocol, not topology.
[[jobs]]
job = "openbao"
target_id = "openbao"
scheme = "http"
metrics_path = "/v1/sys/metrics"
authenticated = true
expected = 1
path_rationale = "OpenBao's built-in system metrics endpoint, fixed by the upstream API surface and identical on every OpenBao deployment; the path is dictated by the product rather than chosen to be unguessable."
params = { format = ["prometheus"] }

  # The as-built labels this job's single endpoint with the logical host name
  # rather than letting `instance` default to the resolved address. Expressible
  # since ADR-0008; a logical name is not a resolved address, and the
  # private-material scan is what keeps it from becoming one.
  [[jobs.static_labels]]
  name = "instance"
  value = "dotmac-observe"
