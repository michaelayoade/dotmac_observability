# The shared Postgres and Redis exporters.
schema_version = "observability-target.v2"
kind = "targets"
product = "shared-data-services"
owner = "platform-operations"

[[jobs]]
job = "postgres-exporter"
target_id = "postgres-exporter"
scheme = "http"
metrics_path = "/metrics"
authenticated = false
expected = 1

  # As-built instance label, expressible since ADR-0008. A logical host or
  # service name, not a resolved address; the private-material scan is what
  # keeps the distinction from eroding.
  [[jobs.static_labels]]
  name = "instance"
  value = "dotmac-db-primary"
[[jobs]]
job = "redis-exporter"
target_id = "redis-exporter"
scheme = "http"
metrics_path = "/metrics"
authenticated = false
expected = 1

  # As-built instance label, expressible since ADR-0008. A logical host or
  # service name, not a resolved address; the private-material scan is what
  # keeps the distinction from eroding.
  [[jobs.static_labels]]
  name = "instance"
  value = "dotmac-db-primary"
