# DotMac Sub's VictoriaMetrics instance, scraped directly. Sub's federated
# import is a separate document under inventory/federations/.
schema_version = "observability-target.v2"
kind = "targets"
product = "dotmac-sub"
owner = "sub-platform"

[[jobs]]
job = "dotmac-sub-victoriametrics"
target_id = "dotmac-sub-victoriametrics"
scheme = "http"
metrics_path = "/metrics"
authenticated = false
expected = 1

  # As-built instance label, expressible since ADR-0008. A logical host or
  # service name, not a resolved address; the private-material scan is what
  # keeps the distinction from eroding.
  [[jobs.static_labels]]
  name = "instance"
  value = "dotmac-sub"
