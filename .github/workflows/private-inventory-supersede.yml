# Supersede the private inventory by applying a REVIEWED retirement request.
#
# This workflow is the only writer of the private inventory. A hand-run
# supersession is exactly the unversioned, unreproducible edit this programme
# exists to replace, so the sequence lives here where it is reviewed, pinned and
# repeatable rather than in somebody's terminal history.
#
# Four properties, each of which was a defect in an earlier draft:
#
#   * It runs on a NAMED runner that reaches the secret store through a proven
#     WireGuard tunnel. Access is bound to the TUNNEL IDENTITY, not to a source
#     address on the plaintext listener — a hosted runner cannot hold that
#     identity, and no `/32` is added to port 8200 to make one work.
#   * The writer credential exists in ONE step's environment, introduced after
#     the tool has been verified. A job-level `env` would hand the production
#     token to checkout, the setup actions and every dependency `poetry install`
#     executes.
#   * The storage shape is CONFIRMED against the reviewed request, not
#     discovered and acted on. Discovery is a separate read-only workflow that
#     reports and stops, with a human in between.
#   * It refuses before the public inventory exists, because the resolution
#     check runs in both directions or not at all.
#   * It CLASSIFIES the stored document before loading it. Both mutation tools
#     used to load the previous version through the ACCEPTED contract as their
#     first act, so a store holding the pre-contract capture format failed with
#     68 schema errors in a tool whose job is to print a digest — after passing
#     the precondition guard, which only checks that public inventory exists.
#     That is the least legible failure available: it reads as corruption and is
#     a document in a known older format.
#
# TWO KINDS OF CHANGE, and the boundary between them is unchanged.
# `retire` removes entries, which needs only their logical names.
# `migrate-capture` rewrites a capture-format document into the accepted one;
# every byte of the result comes from the store, so it carries no resolved
# value either. The single field the capture does not hold — the host binding —
# arrives as a repository secret materialised into a mode-0600 file in the one
# step that needs it and shredded with everything else. A secret is neither
# public Git nor a CI input, which is exactly the distinction rule 21 draws.
# ADDING a target still has no path anywhere, because it needs a resolved
# endpoint that has never been anywhere but the store.
#
# It never emits the document. Not to a log, not to a job summary, not as an
# artifact, and not on the failure path — which is where this normally leaks,
# because the handler added to explain a failure is the one that publishes the
# thing. `tests/architecture/test_supersession_workflow_cannot_leak.py`
# enforces that structurally over this file's text, so a later edit fails the
# build rather than the review.
#
# It never provisions an ADDITION: that needs a resolved value which must not
# pass through public Git or a CI input. It never destroys a prior version: KV v2 retains them, nothing here calls a destroy or
# metadata-delete endpoint, and the superseded version is the evidence for
# every receipt that names it (AGENTS.md rule 21).

name: Supersede the private inventory

on:
  workflow_dispatch:
    inputs:
      request:
        description: >-
          Path to the reviewed request, relative to the repository root. Its
          CONTENT is the change — including its `kind` — so this input only says
          which reviewed file to apply, and nothing typed here can retire or
          migrate anything that was not merged to main first.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-inventory-supersede
  cancel-in-progress: false

jobs:
  # ── The pre-dispatch gate ─────────────────────────────────────────────────
  #
  # A job pinned to an absent runner QUEUES. It is not failed, because
  # `timeout-minutes` bounds execution rather than queueing — which is
  # deliberate, so "no runner" never presents as "the run went wrong". The cost
  # of that correctness is that an operator who dispatches against a runner
  # that was never registered, or that is offline, learns nothing at all: the
  # run simply sits there.
  #
  # So availability is established BEFORE the queue, by a job that can always
  # execute, and the mutation `needs:` it. A failed precondition SKIPS the
  # dependent job rather than queueing it, which is the difference between an
  # answer and a wait.
  #
  # It holds only the repository-scoped runner-query identity, introduced in
  # the one step that needs it after checkout. It never holds an OpenBao or
  # inventory credential. The separate diagnostic proves this identity gets
  # 200 here and 403 on the Starter repository.
  runner-available:
    name: Refuse to queue against an absent or offline runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the exact Observability control runner
        env:
          RUNNER_QUERY_TOKEN: ${{ secrets.RUNNER_QUERY_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/require_runner.py \
            --repository "${GITHUB_REPOSITORY}" \
            --label self-hosted \
            --label dotmac-control-runner \
            --label dotmac-observability-control

  supersede:
    needs: runner-available
    name: Apply a reviewed retirement to the private inventory
    # The named dedicated runner. NOT Observer, not any product host, and not
    # the Foundation test host. It polls OUTBOUND and is never reached; nothing
    # in this job may need inbound reachability to it.
    #
    # A literal label set rather than a repository variable, and that is the
    # point: a variable can be repointed at a hosted runner without touching
    # this file or its guard. The hosted preflight refuses before a missing,
    # offline or busy label set can leave this job queued.
    runs-on: [self-hosted, dotmac-control-runner, dotmac-observability-control]
    # Bounds EXECUTION, not queueing. The hosted preflight handles runner
    # availability; this budget separately bounds a hung store request.
    timeout-minutes: 15

    # Protected main only. `workflow_dispatch` lets a caller choose any ref that
    # carries the workflow, so without this a branch could supply both the
    # workflow and the request it applies — the review gate bypassed by choosing
    # a dropdown value.
    if: github.ref == 'refs/heads/main'

    # The human gate on the write, until Deployment Control authorization
    # replaces it. Main-only, no wait timer, named required reviewer — all
    # configured on the environment in repository settings and NOT assertable
    # from here. `docs/runbooks/retire-a-target.md` records that as setup; this
    # comment is not evidence that it is in place.
    environment: private-inventory

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - run: poetry install

      - name: Refuse a hosted runner
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]; then
            echo "this workflow must run on the named fixed-egress runner, not on a"
            echo "hosted runner reached from a dynamic address range"
            exit 1
          fi

      - name: Refuse fork-controlled content on this runner
        run: |
          set -euo pipefail
          # `pull_request_target` runs TRUSTED base-branch workflow code with a
          # write-capable context, which is exactly why it bypasses the
          # fork-workflow approval gate — and `all_external_contributors` does
          # not cover it. On a runner that can reach the secret store, executing
          # anything a fork controls would hand that reach to a stranger.
          #
          # This workflow is dispatch-only from protected main, so the condition
          # should be impossible. It is checked anyway: "impossible" is a
          # property of the current trigger list, and a trigger list is one line
          # somebody adds later.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; then
            echo "pull_request_target must never run on this runner"
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "refusing to run against ${GITHUB_REF}; protected main only"
            exit 1
          fi

      - name: Refuse a request path that escapes the repository
        run: |
          set -euo pipefail
          request="${{ inputs.request }}"
          case "$request" in
            /*|*..*) echo "the request must be a path inside the repository"; exit 1 ;;
          esac
          test -f "$request" || { echo "no such request: $request"; exit 1; }
          echo "request: $request"

      - name: Refuse to run without the public inventory
        run: |
          set -euo pipefail
          # Resolution is checked in BOTH directions or not at all. Superseding
          # the private half while unable to compare it with the public half is
          # the one-way check this repository refuses everywhere else: it passes
          # while leaving orphans on the side nobody looked at.
          if [ ! -f inventory/control-plane.toml ]; then
            echo "inventory/ is not populated yet (delivery lane 3C)."
            echo "Refusing: the two-directional resolution check cannot run, and a"
            echo "supersession that cannot be resolved is not one worth writing."
            exit 1
          fi

      - name: Verify the tool before any credential is introduced
        id: tool
        run: |
          set -euo pipefail
          # Everything above runs with no production credential anywhere in the
          # environment, and this is the last such step. What follows is the
          # verification that earns the writer token: the dependency set matches
          # the reviewed lockfile, the CLI is the one this commit builds, and
          # the request parses under its contract.
          poetry check --lock
          poetry run dotmac-observability --contracts contracts \
            request-shape --request "${{ inputs.request }}" > "${RUNNER_TEMP}/shape"
          echo "commit: ${GITHUB_SHA}"
          echo "confirmed shape: $(cat "${RUNNER_TEMP}/shape")"
          echo "shape=$(cat "${RUNNER_TEMP}/shape")" >> "$GITHUB_OUTPUT"

          # The kind and the declared previous format, read out of the reviewed
          # request by the same parser that validated it. Two logical strings,
          # neither of which is a value: `grep` over the TOML would be a second
          # reader of the same document and would drift from the contract.
          kind=$(poetry run python -c "
          import sys
          from pathlib import Path
          from dotmac_observability.validate import load_supersession_request
          request = load_supersession_request(Path(sys.argv[1]), contracts=Path('contracts'))
          print(request.kind, request.previous_format, sep='\t')
          " "${{ inputs.request }}")
          echo "kind=$(echo "$kind" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "previous_format=$(echo "$kind" | cut -f2)" >> "$GITHUB_OUTPUT"
          echo "request kind: $(echo "$kind" | cut -f1)"
          echo "declared previous format: $(echo "$kind" | cut -f2)"

      # ── The mutation boundary ────────────────────────────────────────────
      #
      # The writer credential exists in these steps and nowhere else. It is
      # path-scoped to this exact document with only the KV capabilities the
      # sequence needs — read, CAS update, read-back — and no list, delete or
      # destroy. Discovery uses a different, read-only identity: an identity
      # that can do both is the thing to eliminate, not a convenience.

      - name: Read the stored version, confirming the reviewed shape
        id: read
        env:
          BAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
          BAO_TOKEN: ${{ secrets.OPENBAO_INVENTORY_WRITER_TOKEN }}
          BAO_MOUNT: ${{ secrets.OBSERVABILITY_PRIVATE_INVENTORY_MOUNT }}
          BAO_PATH: ${{ secrets.OBSERVABILITY_PRIVATE_INVENTORY_PATH }}
          BAO_FIELD: ${{ secrets.OBSERVABILITY_PRIVATE_INVENTORY_FIELD }}
          SHAPE: ${{ steps.tool.outputs.shape }}
          PREVIOUS_FORMAT: ${{ steps.tool.outputs.previous_format }}
        run: |
          set -euo pipefail
          # NOT `set -x`. Tracing would echo the document into the log, which is
          # the failure this workflow is built to make impossible.
          for name in BAO_ADDR BAO_TOKEN BAO_MOUNT BAO_PATH; do
            if [ -z "${!name:-}" ]; then echo "$name is not configured"; exit 1; fi
          done
          work="${RUNNER_TEMP}/inventory"
          mkdir -p "$work"; chmod 700 "$work"

          curl --fail-with-body -sS \
            -H "X-Vault-Token: ${BAO_TOKEN}" \
            "${BAO_ADDR}/v1/${BAO_MOUNT}/data/${BAO_PATH}" \
            -o "$work/response.json"

          version=$(jq -r '.data.metadata.version' "$work/response.json")
          echo "stored kv version: ${version}"
          echo "kv_version=${version}" >> "$GITHUB_OUTPUT"

          # CONFIRMATION, not discovery. The reviewed request declares the
          # shape; a store that disagrees is a change nobody reviewed, so this
          # refuses instead of adapting to it.
          case "${SHAPE}" in
            data-object)
              jq -e '.data.data.schema_version' "$work/response.json" >/dev/null \
                || { echo "the request declares data-object; the store disagrees"; exit 1; }
              jq -c '.data.data' "$work/response.json" > "$work/v1.json"
              ;;
            field)
              test -n "${BAO_FIELD:-}" \
                || { echo "the request declares field; no field name is configured"; exit 1; }
              jq -e --arg f "${BAO_FIELD}" '.data.data[$f]' "$work/response.json" >/dev/null \
                || { echo "the request declares field; the store disagrees"; exit 1; }
              jq -r --arg f "${BAO_FIELD}" '.data.data[$f]' "$work/response.json" \
                > "$work/v1.json"
              ;;
            *)
              echo "unrecognised shape from the reviewed request: ${SHAPE}"; exit 1 ;;
          esac
          rm -f "$work/response.json"

          # CLASSIFY FIRST. `inventory-digest` loads through the ACCEPTED
          # contract, so on a capture-format store it fails here with a schema
          # error list that reads like corruption. The classifier reads one
          # field, prints one line, and refuses when the store's format is not
          # the one the reviewed request declared — confirmation rather than
          # discovery, the same rule the storage shape follows.
          poetry run dotmac-observability --contracts contracts \
            inventory-classify "$work/v1.json" --expect "${PREVIOUS_FORMAT}"

          # Only an accepted-contract document can be digested. A capture is
          # identified by its own digest inside `inventory-migrate`, which
          # reads it through the contract that describes it.
          if [ "${PREVIOUS_FORMAT}" = "observability-private-inventory.v1" ]; then
            poetry run dotmac-observability --contracts contracts \
              inventory-digest "$work/v1.json"
          fi

      - name: Apply the reviewed request and resolve the result
        env:
          KIND: ${{ steps.tool.outputs.kind }}
          # The ONE resolved value a migration needs and the capture format does
          # not hold. It is a repository secret rather than a dispatch input
          # because an input is echoed into the run's own record; it exists in
          # this step and nowhere else, lands in the same mode-0700 working
          # directory as the document, and is shredded by the always() step
          # below along with it. Empty for a retirement, which needs none.
          HOST_BINDING: ${{ secrets.OBSERVABILITY_HOST_BINDING }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/inventory"
          # Compare-and-set lives in the request: it names the digest it was
          # reviewed against, and this refuses if the store has moved since.
          #
          # For a MIGRATION that refusal has a second reading worth knowing
          # about: migrating rewrites the document and therefore changes its
          # digest, so a request naming the pre-migration digest is refused
          # AFTER the migration has run — correctly, but only after looking as
          # though the work had been done. `inventory-classify` is what tells
          # "already migrated" from "somebody else moved the store", which are
          # the same digest mismatch and different problems.
          if [ "${KIND}" = "migrate-capture" ]; then
            umask 077
            printf '%s' "${HOST_BINDING}" > "$work/host.json"
            test -s "$work/host.json" || {
              echo "OBSERVABILITY_HOST_BINDING is not configured; the accepted contract"
              echo "requires host.identity and host.ssh_alias and the capture holds neither"
              exit 1
            }
            poetry run dotmac-observability --contracts contracts \
              inventory-migrate \
              --request "${{ inputs.request }}" \
              --stored "$work/v1.json" \
              --host-binding "$work/host.json" \
              --output "$work/v2.json"
            shred -u "$work/host.json" 2>/dev/null || rm -f "$work/host.json"
          else
            poetry run dotmac-observability --contracts contracts \
              inventory-apply \
              --request "${{ inputs.request }}" \
              --previous "$work/v1.json" \
              --output "$work/v2.json"
          fi
          # Both directions: no unresolved public target, no unused private
          # binding. Findings name logical ids only.
          poetry run dotmac-observability --contracts contracts \
            validate --private-inventory "$work/v2.json"

      - name: Write the next version, compare-and-set at the store
        env:
          BAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
          BAO_TOKEN: ${{ secrets.OPENBAO_INVENTORY_WRITER_TOKEN }}
          BAO_MOUNT: ${{ secrets.OBSERVABILITY_PRIVATE_INVENTORY_MOUNT }}
          BAO_PATH: ${{ secrets.OBSERVABILITY_PRIVATE_INVENTORY_PATH }}
          BAO_FIELD: ${{ secrets.OBSERVABILITY_PRIVATE_INVENTORY_FIELD }}
          SHAPE: ${{ steps.tool.outputs.shape }}
          KV_VERSION: ${{ steps.read.outputs.kv_version }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/inventory"
          expected=$(poetry run dotmac-observability --contracts contracts \
            inventory-digest "$work/v2.json" | awk '/^sha256/{print $2}')
          echo "EXPECTED_DIGEST=${expected}" >> "$GITHUB_ENV"

          # A SECOND compare-and-set, and not a duplicate of the first. The
          # request's digest proves the CONTENT is the version that was
          # reviewed; KV's `cas` proves no version landed between this run's
          # read and its write. They catch different races.
          if [ "${SHAPE}" = "field" ]; then
            jq -n --arg v "$(cat "$work/v2.json")" --argjson cas "${KV_VERSION}" \
              --arg f "${BAO_FIELD}" \
              '{options: {cas: $cas}, data: {($f): $v}}' > "$work/write.json"
          else
            jq -n --slurpfile d "$work/v2.json" --argjson cas "${KV_VERSION}" \
              '{options: {cas: $cas}, data: $d[0]}' > "$work/write.json"
          fi

          curl --fail-with-body -sS -X POST \
            -H "X-Vault-Token: ${BAO_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @"$work/write.json" \
            "${BAO_ADDR}/v1/${BAO_MOUNT}/data/${BAO_PATH}" \
            -o "$work/written.json"
          rm -f "$work/write.json"
          echo "stored kv version is now: $(jq -r '.data.version' "$work/written.json")"

      - name: Read the stored bytes back and verify the digest
        env:
          BAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
          BAO_TOKEN: ${{ secrets.OPENBAO_INVENTORY_WRITER_TOKEN }}
          BAO_MOUNT: ${{ secrets.OBSERVABILITY_PRIVATE_INVENTORY_MOUNT }}
          BAO_PATH: ${{ secrets.OBSERVABILITY_PRIVATE_INVENTORY_PATH }}
          BAO_FIELD: ${{ secrets.OBSERVABILITY_PRIVATE_INVENTORY_FIELD }}
          SHAPE: ${{ steps.tool.outputs.shape }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/inventory"
          # The step that can fail on a truncated write. The digest recorded
          # above proves this runner could hash a document it was holding; only
          # re-reading what the STORE now returns proves what was stored.
          curl --fail-with-body -sS \
            -H "X-Vault-Token: ${BAO_TOKEN}" \
            "${BAO_ADDR}/v1/${BAO_MOUNT}/data/${BAO_PATH}" \
            -o "$work/readback.json"

          if [ "${SHAPE}" = "field" ]; then
            jq -r --arg f "${BAO_FIELD}" '.data.data[$f]' "$work/readback.json" \
              > "$work/stored.json"
          else
            jq -c '.data.data' "$work/readback.json" > "$work/stored.json"
          fi
          rm -f "$work/readback.json"

          poetry run dotmac-observability --contracts contracts \
            inventory-digest "$work/stored.json" --expect "${EXPECTED_DIGEST}"

      - name: Shred the working copies
        # `always()` so the private document does not survive a failure, and
        # deliberately the ONLY always-run step: a failure handler that gathers
        # context is how this class of workflow leaks.
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/inventory"
          echo "working copies removed"
