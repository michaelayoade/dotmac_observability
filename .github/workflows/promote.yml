# Promote the observability control plane to a NAMED host.
#
# This workflow cannot promote anything today, and every reason is a step that
# refuses out loud rather than a sentence in a runbook. The order of the
# refusals is the order of the sequence, so dispatching it is how an operator
# learns which prerequisite is actually missing rather than which one somebody
# remembered to write down.
#
# Five properties, each of which is a rule this repository already holds:
#
#   * THE TARGET IS NAMED BY A HUMAN. `target` is a required dispatch input
#     with no default, and the executor checks it against the inventory rather
#     than reading it from one (AGENTS.md rule 17). An inventory row is where
#     the name is VERIFIED, never where it comes from.
#   * THE REVISION IS REASSERTED. The dispatched SHA is compared against what
#     the GitHub API reports as the protected branch's tip, at promotion time.
#     A branch name, a tag alone or "latest" is not a promotion target
#     (rule 3), and a repository reading its own HEAD is not an oracle
#     (Governance ADR 0013).
#   * AUTHORIZATION IS CONSUMED. `plan_digest` and `approval_decision_ref` are
#     required inputs, issued by `dotmac-deployment-control`. This repository
#     authorizes nothing and never attests an approval to itself (rule 20), so
#     there is deliberately no "approve" step here and no approver field.
#   * IT RUNS ON THE NAMED RUNNER, and availability is established BEFORE the
#     queue by a hosted job the promotion `needs:` — a job pinned to an absent
#     runner queues forever, and an operator learns nothing (rule 31).
#   * IT REFUSES WITHOUT THE FACILITY. Every host effect belongs to
#     `dotmac-deployment-foundation`, which ships no release-directory staging,
#     no previous-pointer reader, no remote transport, no evaluator reload and
#     no read-back (ADR-0010). Until a version providing them is installable,
#     this workflow stops at that step.
#
# What it never does: edit a file on the host. A change made on the host is
# drift to be reported and reverted, never a fix to be kept (rule 2), and a
# manual host edit would not constitute a promotion in any case — there would
# be no receipt, and a promotion that leaves no record is indistinguishable
# from one that never ran.

name: Promote to a named host

on:
  workflow_dispatch:
    inputs:
      target:
        description: >-
          The LOGICAL host to promote to, named explicitly. No default, on
          purpose: the target is never inferred from an inventory row.
        required: true
        type: string
      plan_digest:
        description: >-
          The approved plan's digest as `dotmac-deployment-control` issued it,
          canonical form included. Do NOT strip the `sha256:` prefix — the
          owner forbids consumers normalizing it, and a stripped digest reads
          later as a plan that changed.
        required: true
        type: string
      approval_decision_ref:
        description: >-
          An opaque reference to the approval decision, resolvable in the
          deployment control plane. Not a person's name.
        required: true
        type: string
      first_promotion:
        description: >-
          Only for a host that has never held a release. It permits a null
          previous-release pointer, which on any later promotion is the failure
          rule 11 exists to prevent.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: promote-observability
  cancel-in-progress: false

jobs:
  # ── The pre-dispatch gate ────────────────────────────────────────────────
  #
  # Same shape and same reason as the supersession workflow's: a job pinned to
  # an absent runner QUEUES, because `timeout-minutes` bounds execution rather
  # than queueing. Availability is therefore established by a job that can
  # always execute, and a failed precondition SKIPS the dependent job instead
  # of leaving it waiting.
  runner-available:
    name: Refuse to queue against an absent or offline runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the exact Observability control runner
        env:
          RUNNER_QUERY_TOKEN: ${{ secrets.RUNNER_QUERY_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/require_runner.py \
            --repository "${GITHUB_REPOSITORY}" \
            --label self-hosted \
            --label dotmac-control-runner \
            --label dotmac-observability-control

  promote:
    needs: runner-available
    name: Promote to the named host
    # The named dedicated runner, as a literal label set. A repository variable
    # here could be repointed at a hosted runner without touching this file.
    runs-on: [self-hosted, dotmac-control-runner, dotmac-observability-control]
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    # The human gate. Main-only, named required reviewer — configured on the
    # environment in repository settings and NOT assertable from here. This
    # comment is not evidence that it is in place.
    environment: observability-promotion

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - run: poetry install

      - name: Refuse a hosted runner
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]; then
            echo "this workflow must run on the named fixed-egress runner"
            exit 1
          fi

      - name: Refuse fork-controlled content and any ref but protected main
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; then
            echo "pull_request_target must never run on this runner"
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "refusing to run against ${GITHUB_REF}; protected main only"
            exit 1
          fi

      - name: Reassert the revision against the protected branch, now
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Rule 3. The dispatched SHA is compared with what the API reports as
          # the branch tip AT THIS MOMENT, not with what it was when somebody
          # opened the dialog. A promotion whose target has moved underneath it
          # is a promotion of a commit nobody chose.
          tip=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/main" \
            | jq -r '.commit.sha')
          echo "dispatched: ${GITHUB_SHA}"
          echo "branch tip: ${tip}"
          if [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "REFUSED: main has moved since this run was dispatched"
            exit 1
          fi
          # The oracle reference recorded in the receipt: this run, which is
          # what performed the comparison above.
          echo "ORACLE_REF=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >> "$GITHUB_ENV"

      - name: Refuse an authorization this repository would have to invent
        env:
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          DECISION_REF: ${{ inputs.approval_decision_ref }}
        run: |
          set -euo pipefail
          # Shape only. Whether the plan is APPROVED is the deployment control
          # plane's decision and is not re-derived here (rule 20); what this
          # refuses is a promotion dispatched with the field left blank or with
          # the canonical prefix stripped off.
          case "${PLAN_DIGEST}" in
            sha256:*) ;;
            *) echo "REFUSED: plan_digest must carry the owner's canonical sha256: prefix"
               exit 1 ;;
          esac
          test -n "${DECISION_REF}" || { echo "REFUSED: no approval decision reference"; exit 1; }

      - name: Refuse a target the inventory does not declare
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # The name comes from the operator; the inventory is where it is
          # CHECKED. Reading the target out of the inventory instead would make
          # the dispatch input decorative and the host implicit.
          declared=$(grep -A2 '^\[host\]' inventory/control-plane.toml \
            | sed -n 's/^target_id = "\(.*\)"$/\1/p')
          test -n "${declared}" || { echo "REFUSED: no host declared in the inventory"; exit 1; }
          if [ "${TARGET}" != "${declared}" ]; then
            echo "REFUSED: named target '${TARGET}' is not the declared host '${declared}'"
            exit 1
          fi
          echo "target confirmed against the inventory: ${TARGET}"

      - name: Refuse until the promotion facility exists
        run: |
          set -euo pipefail
          # THE STEP THIS WORKFLOW CURRENTLY STOPS AT, and it fails closed by
          # construction rather than by a flag somebody can flip.
          #
          # `promote.PromotionFacility` is a Protocol this repository declares
          # and does not implement: staging an immutable release directory,
          # capturing the previous pointer from the host, transporting the
          # tree, reloading the evaluators, reading the state back and
          # restoring on failure all belong to `dotmac-deployment-foundation`.
          # ADR-0010 states exactly what it must provide.
          #
          # The check is for an INSTALLED implementation. A comment saying "not
          # yet" would be removed by whoever wanted to try; an import that
          # fails is removed only by making it succeed.
          probe='import importlib.util, sys; sys.exit(0 if importlib.util.find_spec("dotmac_deployment_foundation.observability_promotion") else 1)'
          if poetry run python -c "${probe}"; then
            echo "the promotion facility is installed"
          else
            echo "REFUSED: no promotion facility is installed."
            echo
            echo "Everything this repository owns is in place: the executor"
            echo "(promote.promote), the six-condition verifier (live_verify.py),"
            echo "the receipt writer and its refusals (receipt.py), and the"
            echo "three-way drift comparison (drift.py)."
            echo
            echo "What is missing is every host effect, and they are not this"
            echo "repository's to write. dotmac-deployment-foundation must provide"
            echo "release-directory staging, a previous-pointer reader, a remote"
            echo "transport, an evaluator reload, and a read-back producing an"
            echo "observability-live-observation.v1 document - with rollback"
            echo "returning that document rather than None."
            echo
            echo "The contract is docs/adr/0010-the-promotion-executor-and-the-facility-contract.md"
            exit 1
          fi

      # Nothing below this line has ever run. It is written out so the sequence
      # is reviewable now rather than invented under a maintenance window, and
      # it is unreachable until the step above passes.

      - name: Promote, verify and write the receipt
        env:
          TARGET: ${{ inputs.target }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          DECISION_REF: ${{ inputs.approval_decision_ref }}
          FIRST_PROMOTION: ${{ inputs.first_promotion }}
        run: |
          set -euo pipefail
          echo "unreachable: the facility gate above has never passed"
          exit 1
