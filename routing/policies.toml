# The root defaults and the ordered route tree.
#
# Measured against the live Alertmanager on 2026-08-30 and reproduced with two
# DELIBERATE DELTAs, marked below: this is no longer a behaviour-preserving
# transcription of that snapshot — the per-severity `repeat_interval` values
# were changed directly on the live host on 2026-09-13 (an emergency fix, not
# yet in git before this change) and are now codified here as the intended,
# differentiated cadence rather than an incidental carry-over from the root.

schema_version = "observability-routing.v2"
kind = "policies"

# The live root, transcribed exactly.
[defaults]
receiver = "default"
group_by = ["alertname", "severity"]
group_wait = "10s"
group_interval = "10s"
repeat_interval = "1h"

# DELTA 1: routing by severity rather than falling through. The live
# configuration used to have NO child routes at all: every alert fell through
# the root to `default`. AGENTS.md rule 7 requires that each `warning` and
# `critical` class reach a DECLARED receiver rather than a fall-through,
# because "the default catches it" is indistinguishable from "nobody chose
# where this goes" — and the two read identically right up until somebody
# changes the default.
#
# Both routes below deliver to the same receiver the fall-through already
# reached, so THIS PART is destination-preserving: no alert changes where it
# is delivered.
#
# DELTA 2: differentiated `repeat_interval`. Critical stays at the root's
# `1h` — a firing critical alert is expected to keep re-paging until it is
# acknowledged or resolved. Warning is intentionally slower, at `12h`: a
# firing warning restating itself hourly was paging noise rather than new
# information, and the live cadence was changed to `12h` to fix that. This is
# NOT behaviour-preserving — it is the deliberate point of this change.
#
# The two classes are the only ones the live rules emit: `alerts.yml` carries
# 22 `severity: critical` and 30 `severity: warning`, and nothing else.
#
# DELTA 3 (2026-09-25): Sub billing/prepaid-collections alerts are delivered
# as a digest. These alerts carry `domain` = `billing_health` or
# `prepaid_enforcement` (federated from dotmac-sub). Several of them track
# STANDING data backlogs — measured 2026-09-25: PrepaidCoverageQuarantinedEvidence
# firing 710h of the last 720h, PrepaidRenewalTermsUnresolved 654h,
# PrepaidFundingQuarantineActive 407h — so the severity routes below re-sent
# each one to Telegram every 12h (warning) or 1h (critical) with no new
# information. Critical billing alerts still page promptly (grouped per
# alert, 4h repeat); every other billing alert is ONE grouped message per
# domain, at most daily. Same receiver as before: this changes cadence and
# grouping, never destination. These two routes MUST precede the severity
# routes, because the first matching route wins.
#
# Applied to the live host by hand on 2026-09-25 (backup
# ops/alertmanager.yml.pre-billing-digest-20260925T173922Z) before this
# change; codified here so the host is not the only copy (AGENTS.md rule 2).
[[routes]]
id = "billing-critical-prompt"
matchers = ['domain=~"billing_health|prepaid_enforcement"', 'severity="critical"']
receiver = "default"
group_by = ["domain", "alertname"]
group_wait = "1m"
group_interval = "15m"
repeat_interval = "4h"

[[routes]]
id = "billing-digest-daily"
matchers = ['domain=~"billing_health|prepaid_enforcement"']
receiver = "default"
group_by = ["domain"]
group_wait = "5m"
group_interval = "6h"
repeat_interval = "24h"

[[routes]]
id = "critical-to-oncall"
matchers = ['severity="critical"']
receiver = "default"
repeat_interval = "1h"

[[routes]]
id = "warning-to-oncall"
matchers = ['severity="warning"']
receiver = "default"
repeat_interval = "12h"
