schema_version = "observability-routing.v2"
kind = "receivers"

# Logical credential names only (ADR-0004). Which token file each one resolves
# to, and which chat or mailbox it reaches, are in the private inventory: a
# store path describes credential custody and a destination names a real
# audience, and neither is something a public repository should publish.

[[receivers]]
name = "oncall"
owner = "platform-oncall"

  [[receivers.integrations]]
  type = "telegram"
  credential_ref = "telegram-oncall"
  send_resolved = true

[[receivers]]
name = "platform-mail"
owner = "platform-oncall"

  [[receivers.integrations]]
  type = "email"
  credential_ref = "platform-smtp"
  send_resolved = false

[[receivers]]
name = "recorded-only"
owner = "platform-oncall"
integrations = []
null_policy = """
Informational alerts are recorded in Prometheus and reviewed on the weekly \
operations pass. They are deliberately not delivered because paging on them \
trained the on-call rotation to mute the channel that also carries criticals.
"""
