schema_version = "observability-target.v2"
kind = "federation"
name = "dotmac-sub-federation"
target_id = "sub-federation"
owner = "sub-platform"
rename_prefix = "federated_"
scrape_interval = "60s"
match = ['{job="dotmac-sub"}', '{__name__=~"observability_state"}']

[source]
scheme = "https"
path = "/federate"
authenticated = true

[[labels]]
name = "federated_from"
value = "dotmac-sub"
