schema_version = "observability-target.v2"
kind = "targets"
product = "dotmac-erp"
owner = "erp-platform"

# Logical only (ADR-0004). Where `erp-production` and `erp-workers` actually
# point, and which credential the first of them presents, live in the private
# inventory this fixture resolves against.

[[jobs]]
job = "dotmac-erp-app"
target_id = "erp-production"
scheme = "https"
metrics_path = "/metrics"
authenticated = true
expected = 1
scrape_interval = "15s"

  [[jobs.labels]]
  name = "product"
  value = "dotmac-erp"

  [[jobs.labels]]
  name = "tier"
  value = "app"

[[jobs]]
job = "dotmac-erp-worker"
target_id = "erp-workers"
scheme = "https"
metrics_path = "/metrics"
authenticated = false
expected = 2

  [[jobs.labels]]
  name = "product"
  value = "dotmac-erp"

  [[jobs.labels]]
  name = "tier"
  value = "worker"
