schema_version = "observability-target.v2"
kind = "targets"
product = "dotmac-status"
owner = "platform-operations"

# The two cases ADR-0004 left as judgement calls, exercised so the gates that
# settle them have a positive control as well as a refusal. Both endpoints here
# are synthetic `.invalid` names, so nothing is actually disclosed; what is
# being proved is that a render can carry a reviewed exception and that the
# approval fields are load-bearing rather than decorative.

[[jobs]]
job = "dotmac-status-page"
target_id = "status-page"
scheme = "https"
metrics_path = "/internal/telemetry"
authenticated = false
expected = 1
path_rationale = "The exporter is mounted under the application's own routing prefix, which is published in its API documentation; the path is protocol, not concealment."

  [jobs.publication]
  endpoints = ["status.dotmac.invalid:443"]
  rationale = "The status page is deliberately on the public internet and its address is printed on every incident notice, so indirection would conceal nothing from anybody who has already read one."
  approved_by = "reference-fixture"
  approved_on = "2026-08-29"

  [[jobs.labels]]
  name = "product"
  value = "dotmac-status"
