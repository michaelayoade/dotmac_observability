groups:
  - name: control-plane-meta
    rules:
      - alert: IngestionIntegrity
        expr: "(min(up{job=~\".+\"}) == 1) unless (increase(prometheus_target_scrapes_sample_duplicate_timestamp_total[15m]) == 0)"
