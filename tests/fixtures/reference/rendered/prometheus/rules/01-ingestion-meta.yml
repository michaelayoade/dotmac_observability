# GENERATED by `dotmac-observability render` — do not edit.
# Source of truth: inventory/, bundles/ and routing/ in dotmac_observability.
# `make render-check` compares these bytes against a fresh render and fails on drift.
groups:
  - name: ingestion-meta
    rules:
      - alert: LogsShipperSilent
        expr: "absent_over_time(loki_distributor_lines_received_total[15m])"
        labels:
          severity: critical
          owner: observability-control-plane
        annotations:
          summary: "logs: nothing has arrived for 15m"
          description: "Written as an ABSENCE rather than a rate threshold. A stopped shipper takes its series with it, and a comparison against a series that no longer exists matches no rows and fires nothing — which is the failure mode a metrics pipeline is worst at noticing."
      - alert: LogsIntegrityUnmeasured
        expr: "absent(loki_discarded_samples_total)"
        labels:
          severity: warning
          owner: observability-control-plane
        annotations:
          summary: "logs: loki_discarded_samples_total has never been observed, so nothing is known about whether records are being dropped"
          description: "UNMEASURED is not zero. A drop counter reading zero because nothing was shipped and one reading zero because nothing was lost are the same number and opposite news; this alert is what keeps them apart."
      - alert: LogsIngestionDropping
        expr: "increase(loki_discarded_samples_total[15m]) > 0"
        for: "15m"
        labels:
          severity: critical
          owner: observability-control-plane
        annotations:
          summary: "logs: records arrived and were not stored"
          description: "Delta-shaped over the declared window, never `== 0` against the absolute counter: a bare zero is satisfiable by a reset, a fresh store or a restart, and a predicate made true that way cannot be told from one made true by a repair (AGENTS.md rule 30)."
      - alert: MetricsShipperSilent
        expr: "absent_over_time(prometheus_tsdb_head_samples_appended_total[10m])"
        labels:
          severity: critical
          owner: observability-control-plane
        annotations:
          summary: "metrics: nothing has arrived for 10m"
          description: "Written as an ABSENCE rather than a rate threshold. A stopped shipper takes its series with it, and a comparison against a series that no longer exists matches no rows and fires nothing — which is the failure mode a metrics pipeline is worst at noticing."
      - alert: MetricsIntegrityUnmeasured
        expr: "absent(prometheus_target_scrapes_sample_duplicate_timestamp_total)"
        labels:
          severity: warning
          owner: observability-control-plane
        annotations:
          summary: "metrics: prometheus_target_scrapes_sample_duplicate_timestamp_total has never been observed, so nothing is known about whether records are being dropped"
          description: "UNMEASURED is not zero. A drop counter reading zero because nothing was shipped and one reading zero because nothing was lost are the same number and opposite news; this alert is what keeps them apart."
      - alert: MetricsIngestionDropping
        expr: "increase(prometheus_target_scrapes_sample_duplicate_timestamp_total[15m]) > 0"
        for: "15m"
        labels:
          severity: critical
          owner: observability-control-plane
        annotations:
          summary: "metrics: records arrived and were not stored"
          description: "Delta-shaped over the declared window, never `== 0` against the absolute counter: a bare zero is satisfiable by a reset, a fresh store or a restart, and a predicate made true that way cannot be told from one made true by a repair (AGENTS.md rule 30)."
      - alert: MetricsIngestionLag
        expr: "max by (host_id) (prometheus_remote_storage_highest_timestamp_in_seconds) - max by (host_id) (prometheus_remote_storage_queue_highest_sent_timestamp_seconds) > 300"
        for: "5m"
        labels:
          severity: warning
          owner: observability-control-plane
        annotations:
          summary: "metrics: the store is more than 5m behind"
          description: "Lag is a third fact, separate from arrival and from integrity. A stream can be arriving and storing cleanly and still be far enough behind that a query answers about a system that no longer exists."
      - alert: NotificationPathSilent
        expr: "(increase(alertmanager_alerts_received_total[30m]) > 0) unless (increase(alertmanager_notifications_total[30m]) > 0)"
        for: "30m"
        labels:
          severity: critical
          owner: observability-control-plane
        annotations:
          summary: "Alerts reached Alertmanager and nothing was notified. Delivery failing is indistinguishable from a quiet fleet on every dashboard there is, and this is the only rule that separates them."
          sensitivity: "UNPROVED — this deadman has never been observed to fire, so it is not known to work. It is indistinguishable from one whose expression matches no series at all. Planted condition: Point the receiver's credential file at an unreadable path on a disposable host, fire a canary alert, and confirm this signal fires within its hold. The control is the same pass with the credential restored, which must NOT fire."
          procedure: "docs/runbooks/README.md"
      - alert: EvaluatorSelfScrapeMissing
        expr: "absent_over_time(up[10m])"
        for: "10m"
        labels:
          severity: critical
          owner: observability-control-plane
        annotations:
          summary: "The evaluator has stopped scraping itself, so every rule written over its own series is now evaluating against nothing and reporting no failures."
          sensitivity: "UNPROVED — this deadman has never been observed to fire, so it is not known to work. It is indistinguishable from one whose expression matches no series at all. Planted condition: Remove the self-scrape job on a disposable host and confirm this fires within its hold; then restore it as the positive control. It does NOT detect the evaluator being dead — nothing evaluated by the evaluator can — and that gap is the unmonitored region recorded in docs/CONTROL_EXCEPTIONS.md."
          procedure: "docs/runbooks/README.md"
