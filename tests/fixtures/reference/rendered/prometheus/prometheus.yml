# GENERATED by `dotmac-observability render` — do not edit.
# Source of truth: inventory/, bundles/ and routing/ in dotmac_observability.
# `make render-check` compares these bytes against a fresh render and fails on drift.
global:
  scrape_interval: "30s"
  scrape_timeout: "10s"
  evaluation_interval: "30s"
  external_labels:
    environment: reference
    control_plane: dotmac-observability
rule_files:
  - "/etc/prometheus/rules/*.yml"
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"
scrape_configs:
  - job_name: dotmac-erp-app
    scheme: https
    metrics_path: "/metrics"
    scrape_interval: "15s"
    bearer_token_file: "/etc/prometheus/secrets/erp-scrape.token"
    static_configs:
      - targets:
          - "erp.invalid:443"
        labels:
          product: dotmac-erp
          tier: app
  - job_name: dotmac-erp-worker
    scheme: https
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "erp-worker-1.invalid:443"
          - "erp-worker-2.invalid:443"
        labels:
          product: dotmac-erp
          tier: worker
  - job_name: dotmac-sub-federation
    honor_labels: true
    scheme: https
    metrics_path: "/federate"
    params:
      "match[]":
        - "{job=\"dotmac-sub\"}"
        - "{__name__=~\"observability_state\"}"
    scrape_interval: "60s"
    bearer_token_file: "/etc/prometheus/secrets/sub-federation.token"
    static_configs:
      - targets:
          - "sub.invalid:443"
        labels:
          federated_from: dotmac-sub
    metric_relabel_configs:
      - source_labels:
          - __name__
        regex: "(up|scrape_.+)"
        target_label: __name__
        replacement: "federated_${1}"
